name: Analyze Reported Authors

concurrency:
  group: analyze-trolls
  cancel-in-progress: false

on:
  push:
    paths:
      - 'queue/**.json'
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install cheerio groq-sdk

      # - name: Install Playwright Chromium Browser
      #   run: npx playwright install chromium --with-deps

      - name: Run Troll Analysis Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/analyze_trolls.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trolls.json queue/

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit, skipping."
          else
            git commit -m "Automated Troll Analysis: Database update [skip ci]"

            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push failed, retrying ($i/3)..."
              sleep 5
            done
          fi
